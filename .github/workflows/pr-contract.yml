name: pr-contract
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# ONE job, one assertion: every rule id this PR body cites must RESOLVE against the register, the ADR
# directories, or the spec ledger. `D-99` fails the build. An invented id is an invented constraint.
#
# `types: [edited]` on purpose: the body is editable after the fact, so without it the check would be
# a one-time toll rather than a standing condition.
#
# WHAT WAS HERE AND WHY IT IS GONE (2026-08-27 founder ruling; receipts in
# docs/00_workspace/review-test-suite-2026-08-26.md §Q3). Two jobs were deleted:
#
#   declares-its-areas -> ci/check_round.sh   computed the areas from the diff, then demanded the
#                                             author retype them and graded the typing. No fact here
#                                             that the runner did not already possess.
#   closes-out         -> ci/check_closeout.sh  graded the shape of `Learned:` and `Friction:` lines.
#                                             `Friction: fine - EARNED` passed in four words while the
#                                             honest `Friction: none` needed a dash and 30 characters.
#                                             Its one real obligation proved "a doc was touched", never
#                                             "the doc is true": it fired, system_map.md was touched, CI
#                                             went green, and the line still cited a workflow that does
#                                             not exist.
#
# Also gone: the `--selftest` step that ran here on every PR. It guarded against the register being
# reformatted underneath the resolvers — but that failure mode makes this gate go RED (real ids stop
# resolving), never silently green. Silent-pass requires loosening the regex, which is a code change a
# human reviews. `ci/check_citations.sh --selftest` still exists; run it when you edit the resolver.
#
# Deliberately NOT asserted: that the citation is APPOSITE. No script can tell whether D-7 is the right
# rule for your change. That is semantic, and it belongs to the area expert
# (../harness/roles/area-expert.md). You can prove nobody invented a rule id. You cannot prove they
# obeyed one.
permissions:
  contents: read
jobs:
  cites-the-law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every rule id cited in the PR body must exist
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | ci/check_citations.sh -
