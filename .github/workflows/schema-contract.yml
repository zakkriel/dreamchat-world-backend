name: schema-contract
on:
  push: { branches: ["**"] }
  pull_request:
jobs:
  spec-011:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build db image (pinned Postgres 16 + pgTAP)
        run: docker compose build db
      - name: Reset to a clean, migrated, seeded DB
        run: make reset
      - name: "SPEC-011 — payload↔schema (dir 1) + DDL nullability (dir 2) + teeth"
        run: make schema-contract
