name: invariants
on:
  push: { branches: ["**"] }
  pull_request:
jobs:
  phase-0a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build db image (pinned Postgres 16 + pgTAP + pg_prove)
        run: docker compose build db
      - name: Reset to a clean, migrated, seeded DB
        run: make reset
      - name: "Run invariant suite (pgTAP: I-1/I-2/I-7 + guards + golden)"
        run: make test
      - name: Determinism (DoD §8.5) — fingerprint first deploy
        run: make fingerprint > /tmp/deploy1.txt
      - name: Determinism (DoD §8.5) — second fresh deploy
        run: make reset
      - name: Determinism (DoD §8.5) — identical projection data across deploys
        run: |
          make fingerprint > /tmp/deploy2.txt
          diff /tmp/deploy1.txt /tmp/deploy2.txt
      - name: Schema audit (schema.sql matches committed)
        run: make schema-check
